events:
  Create Petkeeper:
    conditions:
      - not char_exists spyder_flower_petkeeper
    actions:
      - create_npc spyder_flower_petkeeper,5,4
      - char_face spyder_flower_petkeeper,down

  Talk Petkeeper:
    conditions:
      - is char_facing_char player,spyder_flower_petkeeper
      - is button_pressed INTERACT
    actions:
      - char_face spyder_flower_petkeeper,player
      - dialog Welcome to the Pet Shop! We have wonderful monsters looking for good homes.
      - dialog Come back when we have more stock!

  Go Outside:
    x: 5
    y: 8
    conditions:
      - is char_at player
      - is char_facing player,down
    actions:
      - transition_teleport player,spyder_flower_city.tmx,18,10,0.3
      - char_face player,down
