events:
  Create Shopkeeper:
    conditions:
    - not char_exists spyder_flower_shopkeeper
    actions:
    - create_npc spyder_flower_shopkeeper,6,5
    - char_face spyder_flower_shopkeeper,down

  Talk Shopkeeper:
    conditions:
    - is char_facing_char player,spyder_flower_shopkeeper
    - is button_pressed INTERACT
    actions:
    - char_face spyder_flower_shopkeeper,player
    - open_shop spyder_flower_shopkeeper

  Go Outside:
    x: 6
    y: 10
    conditions:
    - is char_at player
    - is char_facing player,down
    actions:
    - transition_teleport player,spyder_flower_city.tmx,26,10,0.3
    - char_face player,down
