  # --- NPC spawns ---

  Create Monk:
    conditions:
    - not char_exists spyder_cottontown_monk
    - not battle_outcome player,won,spyder_dragonscave_benden
    actions:
    - create_npc spyder_cottontown_monk,5,7,wander

  Create Statue Orange:
    conditions:
    - not char_exists spyder_statue_orange
    - not battle_outcome player,won,spyder_dragonscave_benden
    actions:
    - create_npc spyder_statue_orange,3,7

  Create Statue Blue:
    conditions:
    - not char_exists spyder_statue_blue
    - not battle_outcome player,won,spyder_dragonscave_benden
