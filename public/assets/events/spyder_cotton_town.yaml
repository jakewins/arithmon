    actions:
    - create_npc spyder_dragonscave_lazybrute,3,36
    - char_face spyder_dragonscave_lazybrute,right

  Create Confused:
    conditions:
    - not char_exists spyder_confusedperson
    - not variable_set dragonscavedrokoro:yes
    actions:
    - create_npc spyder_confusedperson,6,33
    - char_face spyder_confusedperson,player

  # --- NPC dialogs ---

  Talk Monk:
    behav: talk spyder_cottontown_monk
    actions:
    - translated_dialog spyder_cottontown_monk

  Talk Brute:
    behav: talk spyder_dragonscave_lazybrute
    actions:
    - translated_dialog spyder_cotton_lazybrute

  Talk Confused Pre Battle:
    conditions:
    - not battle_outcome player,won,spyder_confusedperson
    behav: talk spyder_confusedperson
    actions:
    - translated_dialog spyder_confused1
    - translated_dialog_choice yes:no,confusedchoice

  Talk Confused Post Battle:
    conditions:
    - is battle_outcome player,won,spyder_confusedperson
    behav: talk spyder_confusedperson
    actions:
    - translated_dialog spyder_confused2

  Battle Confused:
    x: 8
    y: 36
    conditions:
    - not battle_outcome player,won,spyder_confusedperson
    - is variable_set confusedchoice:yes
    actions:
    - add_monster pairagrin,2,spyder_confusedperson,5,10
    - add_monster capiti,2,spyder_confusedperson,5,10
    - start_battle player,spyder_confusedperson
    - translated_dialog spyder_confused2

  # --- Hacker intro ---

  Hacker Intro:
    x: 25
    y: 37
    width: 3
    height: 1
    conditions:
    - is char_at player
    - not variable_set spokencottonhacker:yes
    actions:
    - char_stop player
    - lock_controls
    - create_npc spyder_cottontown_hacker,25,30
    - pathfind spyder_cottontown_hacker,25,36
    - char_face player,up
    - translated_dialog spyder_cottontown_hackerintro
    - pathfind spyder_cottontown_hacker,25,29
    - remove_npc spyder_cottontown_hacker
    - set_variable spokencottonhacker:yes
    - unlock_controls

  # --- Stop hacker (route 2 gate) ---

  Stop Cotton:
    x: 38
    y: 28
    width: 1
    height: 2
    conditions:
    - is char_at player
    - not variable_set visitedcottoncafe:yes
    actions:
    - char_stop player
    - lock_controls
    - create_npc spyder_cottontown_hacker,31,23
    - pathfind_to_char player,spyder_cottontown_hacker,left
    - char_face spyder_cottontown_hacker,right
    - translated_dialog spyder_cottontown_stopthere
    - pathfind player,36,28
    - wait 0.5
    - pathfind_to_char player,spyder_cottontown_hacker,left
    - char_face spyder_cottontown_hacker,right
    - wait 0.5
    - translated_dialog spyder_cottontown_followme
    - wait 0.5
    - pathfind spyder_cottontown_hacker,31,23
    - remove_npc spyder_cottontown_hacker
    - unlock_controls

  # --- Mom encounter ---

  Nu Phone Mom:
    x: 31
    y: 17
    conditions:
    - is char_at player
    - not variable_set spokenmomcotton:yes
    - not has_item player,nu_phone
    - not has_item player,app_banking
    - not has_item player,app_map
    actions:
    - char_stop player
    - lock_controls
    - create_npc spyder_papertown_mom,22,18
    - pathfind spyder_papertown_mom,31,18
    - unlock_controls
    - char_face spyder_papertown_mom,player
    - char_face player,spyder_papertown_mom
    - translated_dialog spyder_cottontown_mom
    - add_item nu_phone
    - translated_dialog nu_phone,,center,center,center
    - add_item app_banking
    - translated_dialog app_banking,,center,center,center
    - add_item app_map
    - translated_dialog app_map,,center,center,center
    - pathfind spyder_papertown_mom,22,18
    - set_variable spokenmomcotton:yes
    - remove_npc spyder_papertown_mom

  # --- Kernel Quest ---

  Kernel Quest:
    x: 20
    y: 27
    conditions:
    - is char_at player
    - not variable_set kernelquestbegin:yes
    - is variable_set bumpintomom:yes
    actions:
    - char_stop player
    - lock_controls
    - create_npc spyder_papertown_mom,18,33
    - create_npc spyder_cottontown_hacker,24,33
    - pathfind_to_char player,spyder_papertown_mom,down
    - pathfind_to_char player,spyder_cottontown_hacker,right
    - wait 0.5
    - translated_dialog spyder_cottontown_mom1
    - wait 0.5
    - char_face player,right
    - wait 0.5
    - translated_dialog spyder_cottontown_hacker1
    - wait 0.5
    - char_face player,down
    - wait 0.5
    - translated_dialog spyder_cottontown_mom2
    - wait 0.5
    - char_face player,right
    - wait 0.5
    - translated_dialog spyder_cottontown_hacker2
    - wait 0.5
    - char_face player,down
    - pathfind spyder_papertown_mom,18,33
    - pathfind spyder_cottontown_hacker,24,33
    - set_variable kernelquestbegin:yes
    - remove_npc spyder_papertown_mom
    - remove_npc spyder_cottontown_hacker
    - unlock_controls

