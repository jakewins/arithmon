events:
  Play Music:
    conditions:
      - not music_playing music_the_wild_places
    actions:
      - play_music music_the_wild_places

  # --- Encounter zones ---

  Encounters:
    x: 2
    y: 2
    width: 21
    height: 16
    conditions:
      - is char_moved player
      - is char_at player
    actions:
      - random_encounter spyder_routeA,11

  Go Route 4 10:
    x: 22
    y: 10
    conditions:
      - is char_at player
      - is char_facing player,right
    actions:
      - transition_teleport player,spyder_route4.tmx,15,5,0.3
      - char_face player,right

  Go Route 4 11:
    x: 22
    y: 11
    conditions:
      - is char_at player
      - is char_facing player,right
    actions:
      - transition_teleport player,spyder_route4.tmx,15,6,0.3
      - char_face player,right

  Route Sign:
    x: 3
    y: 9
    conditions:
      - is char_facing_tile player
      - is button_pressed INTERACT
    actions:
      - dialog Route A — A quiet side path
