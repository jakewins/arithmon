events:
  Play Music:
    conditions:
    - not music_playing music_town_theme
    actions:
    - play_music music_town_theme

  Set Seen Candy:
    conditions:
    - not variable_set seencandy:yes
    actions:
    - set_variable seencandy:yes

  Go Flower City 13:
    x: 0
    y: 13
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_flower_city.tmx,37,13,0.3
    - char_face player,left

  Go Flower City 14:
    x: 0
    y: 14
    conditions:
    - is char_at player
