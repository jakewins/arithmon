  # --- NPC spawns ---

  Create Greeter:
    conditions:
    - not char_exists greeter
    actions:
    - create_npc greeter,17,18

  Create Monk:
    conditions:
    - not char_exists cotton_town_monk
    actions:
    - create_npc cotton_town_monk,5,18
    - char_face cotton_town_monk,right

  Create Florist:
    conditions:
    - not char_exists cotton_town_florist
    actions:
    - create_npc cotton_town_florist,30,15
    - char_face cotton_town_florist,down

  # --- NPC dialogs ---

  Talk Monk:
    behav: talk cotton_town_monk
    actions:
    - dialog The monsters here respond to mathematics. Solve their puzzles to gain Dark Power.
    - dialog Use that power wisely in battle.

  Talk Florist:
    behav: talk cotton_town_florist
    actions:
    - dialog I used to grow flowers here, but the wild monsters trampled my garden!

  # --- Signs ---

  Town Sign:
    conditions:
      - is char_facing_tile
      - is button_pressed INTERACT
    actions:
      - dialog Cotton Town - A peaceful village surrounded by wild monsters.
    x: 15
    y: 16
    width: 1
    height: 1

  Healing Center Sign:
    x: 24
    y: 27
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog Healing Center - Rest your monsters here.

  Cotton Scoop Sign:
    x: 7
    y: 27
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
