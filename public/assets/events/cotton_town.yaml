  # --- NPC spawns ---

  Create Florist:
    conditions:
    - not char_exists cotton_town_florist
    actions:
    - create_npc cotton_town_florist,30,15
    - char_face cotton_town_florist,down

  # --- NPC dialogs ---

  Talk Florist:
    behav: talk cotton_town_florist
    actions:
    - dialog I used to grow flowers here, but the wild monsters trampled my garden!

  # --- Signs ---

  Town Sign:
    conditions:
      - is char_facing_tile
      - is button_pressed INTERACT
    actions:
      - dialog Cotton Town - A peaceful village surrounded by wild monsters.
    x: 15
    y: 37
    width: 1
    height: 1

  Healing Center Sign:
