events:
  Hacker Intro:
    conditions:
      - is char_at player
      - not variable_set spokencottonhacker:yes
    actions:
      - lock_controls
      - create_npc hacker,30,18
      - pathfind hacker,25,18
      - char_face player,hacker
      - dialog Welcome to Cotton Town! Watch out for wild monsters...
      - dialog I'm a hacker. I can help you out. But first you need to prove yourself.
      - pathfind hacker,30,18
      - remove_npc hacker
      - set_variable spokencottonhacker:yes
      - unlock_controls
    x: 23
    y: 17
    width: 4
    height: 3

  Greeter Ask:
    conditions:
      - is char_facing_char player,greeter
      - is button_pressed INTERACT
      - not variable_set greeter_mood
    actions:
      - char_face greeter,player
      - dialog Welcome to Cotton Town! The monsters here are restless...
      - dialog How are you feeling about all this?
      - translated_dialog_choice good:bad,greeter_mood
    x: 17
    y: 18
    width: 1
    height: 1

  Greeter Reply Good:
    conditions:
      - is variable_set greeter_mood:good
      - not variable_set greeter_replied:yes
    actions:
      - dialog That's the spirit! You'll do great out there. Good luck!
      - set_variable greeter_replied:yes
    x: 17
    y: 18
    width: 1
    height: 1

  Greeter Reply Bad:
    conditions:
      - is variable_set greeter_mood:bad
      - not variable_set greeter_replied:yes
    actions:
      - dialog I understand... it can be scary. But you're braver than you think. Hang in there!
      - set_variable greeter_replied:yes
    x: 17
    y: 18
    width: 1
    height: 1

  Greeter Talk Again:
    conditions:
      - is char_facing_char player,greeter
      - is button_pressed INTERACT
      - is variable_set greeter_replied:yes
    actions:
      - char_face greeter,player
      - dialog Good to see you again! Stay safe out there.
    x: 17
    y: 18
    width: 1
    height: 1

  # --- Map connections: healing center ---

  Enter Healing Center:
    x: 22
    y: 27
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,spyder_healing_center.tmx,6,9,0.3
    - char_face player,up

  # --- Map connections: Cotton Scoop ---

  Enter Cotton Scoop:
    x: 9
    y: 27
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,spyder_cotton_scoop.tmx,6,9,0.3
    - char_face player,up

