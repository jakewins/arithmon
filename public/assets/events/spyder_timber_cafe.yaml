events:
  Create Beaverbrook:
    conditions:
    - not char_exists spyder_timber_beaverbrook
    actions:
    - create_npc spyder_timber_beaverbrook,5,4
    - char_face spyder_timber_beaverbrook,down

  Talk Beaverbrook:
    conditions:
    - is char_facing_char player,spyder_timber_beaverbrook
    - is button_pressed INTERACT
    actions:
    - char_face spyder_timber_beaverbrook,player
    - dialog Welcome to our cafe! Take a seat and rest your weary feet.
    - dialog The storms have been getting worse lately. Something strange is going on...

  Go Outside:
    x: 5
    y: 8
    conditions:
    - is char_at player
    - is char_facing player,down
    actions:
    - transition_teleport player,spyder_timber_town.tmx,20,8,0.3
    - char_face player,down
