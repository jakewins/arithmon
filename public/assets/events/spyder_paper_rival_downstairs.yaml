events:
  # --- Music ---

  Play Music:
    conditions:
    - not music_playing music_home
    actions:
    - play_music music_home

  # --- Map connections ---

  Go Outside:
    x: 1
    y: 12
    conditions:
    - is char_at player
    - is char_facing player,down
    actions:
    - transition_teleport player,spyder_paper_town.tmx,32,6,0.3
    - char_face player,down

  Go Upstairs:
    x: 8
    y: 2
    conditions:
    - is char_at player
    actions:
    - transition_teleport player,spyder_paper_rival_bedroom.tmx,7,6,0.3
    - char_face player,up

  # --- Interactables ---

  Watch TV:
    x: 1
    y: 4
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog The TV is showing a news report about unusual weather patterns across the region.

  Table:
    x: 3
    y: 6
    width: 3
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog A dining table with a half-finished puzzle.

  Kitchen Counter:
    x: 7
    y: 4
    width: 2
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog Jars of cookies and a kettle.

  Bookshelf Right:
    x: 7
    y: 2
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog Old photo albums and recipe books.

  Bookshelf Left:
    x: 5
    y: 2
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog A collection of adventure stories.
