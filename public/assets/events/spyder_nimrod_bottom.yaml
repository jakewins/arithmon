events:
  Go Cotton Tunnel:
    x: 7
    y: 12
    conditions:
      - is char_at player
      - is char_facing player,down
    actions:
      - transition_teleport player,spyder_cotton_tunnel.tmx,26,10,0.3
      - char_face player,left

  Go Middle:
    x: 13
    y: 3
    conditions:
      - is char_at player
      - is char_facing player,up
    actions:
      - transition_teleport player,spyder_nimrod_middle.tmx,1,4,0.3
      - char_face player,down

  Documents:
    x: 1
    y: 3
    conditions:
      - is char_facing_tile player
      - is button_pressed INTERACT
    actions:
      - dialog Classified documents about Project Spyder. Most pages are redacted.
