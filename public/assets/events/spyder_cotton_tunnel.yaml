events:
  Play Music:
    conditions:
    - not music_playing music_the_wild_places
    actions:
    - play_music music_the_wild_places

  # --- Encounter zones ---

  Encounters:
    x: 2
    y: 2
    width: 26
    height: 16
    conditions:
    - is char_moved player
    - is char_at player
    actions:
    - random_encounter spyder_cotton_tunnel,8

  Go Greenwash:
    x: 2
    y: 10
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_greenwash.tmx,7,8,0.3
    - char_face player,left

  Go Dragons Cave:
    x: 27
    y: 5
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,spyder_dragons_cave.tmx,5,10,0.3
    - char_face player,up

  Go Dryads Grove:
    x: 27
    y: 15
    conditions:
    - is char_at player
    - is char_facing player,down
    actions:
    - transition_teleport player,spyder_dryads_grove.tmx,7,2,0.3
    - char_face player,down

  Go Nimrod:
    x: 27
    y: 10
    conditions:
    - is char_at player
    - is char_facing player,right
    actions:
    - transition_teleport player,spyder_nimrod_bottom.tmx,7,11,0.3
    - char_face player,right
