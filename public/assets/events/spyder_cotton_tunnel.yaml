events:
  Play Music:
    conditions:
    - not music_playing music_the_wild_places
    actions:
    - play_music music_the_wild_places

  # --- Encounter zones ---

  Encounters:
    x: 1
    y: 3
    width: 38
    height: 17
    conditions:
    - is char_moved player
    - is char_at player
    actions:
    - random_encounter spyder_cotton_tunnel,8

  # --- Map connections ---

  Go Cotton Town:
    x: 35
    y: 3
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,spyder_cotton_town.tmx,2,36,0.3
    - char_face player,up

  Go Dragons Cave:
    x: 3
    y: 16
    conditions:
    - is char_at player
    - is char_facing player,down
    - is variable_set dragonscavedrokoro:yes
    actions:
    - transition_teleport player,spyder_dragons_cave.tmx,16,5,0.3
    - char_face player,down

  Reject Dragons Cave:
    x: 3
    y: 16
    conditions:
    - is char_at player
    - is char_facing player,down
    - not variable_set dragonscavedrokoro:yes
    actions:
    - dialog The way ahead is blocked by rubble. It looks like it leads deeper underground...

  Go Dryads Grove:
    x: 31
    y: 3
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,spyder_dryads_grove.tmx,36,36,0.3
    - char_face player,up
