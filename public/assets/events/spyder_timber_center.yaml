events:
  Create Nurse:
    conditions:
      - not char_exists spyder_timber_nurse
    actions:
      - create_npc spyder_timber_nurse,6,4
      - char_face spyder_timber_nurse,down

  Talk Nurse:
    conditions:
      - is char_facing_char player,spyder_timber_nurse
      - is button_pressed INTERACT
    actions:
      - char_face spyder_timber_nurse,player
      - dialog Welcome to Timber Healing Center. Let me restore your monsters.
      - screen_transition 1
      - wait 0.5
      - set_monster_health
      - set_monster_status
      - dialog Your monsters are all healed up!
      - set_teleport_faint player,spyder_timber_center.tmx,6,7

  Go Outside:
    x: 6
    y: 10
    conditions:
      - is char_at player
      - is char_facing player,down
    actions:
      - transition_teleport player,spyder_timber_town.tmx,10,8,0.3
      - char_face player,down
