    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_route1.tmx,39,4,0.3
    - char_face player,left

  Teleport to Route 1B:
    x: 0
    y: 5
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_route1.tmx,39,5,0.3
    - char_face player,left

  # --- Map connections: north to Route 2 ---
