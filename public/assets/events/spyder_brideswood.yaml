events:
  # --- Music ---

  Route Music:
    conditions:
    - not music_playing music_the_wild_places
    actions:
    - play_music music_the_wild_places

  # --- Map connections: west back to Paper Town ---

  Teleport to Paper Town A:
    x: 0
    y: 26
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_paper_town.tmx,39,6,0.3
    - char_face player,left

  Teleport to Paper Town B:
    x: 0
    y: 27
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_paper_town.tmx,39,7,0.3
    - char_face player,left

  # --- Map connections: west to Route 1 ---

  Teleport to Route 1A:
    x: 0
    y: 4
    conditions:
