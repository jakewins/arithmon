  # the follow-up story lands. QA does NOT walk off the north edge here.

  Teleport to Route 2A:
    x: 36
    y: 0
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,spyder_route2.tmx,36,19,0.3
    - char_face player,up

  Teleport to Route 2B:
    x: 37
    y: 0
    conditions:
    - is char_at player
    - is char_facing player,up
