events:
  # --- Music ---

  Play Music:
    conditions:
    - not music_playing music_the_wild_places
    actions:
    - play_music music_the_wild_places

  # --- NPC spawns ---

  Create Roddick:
    conditions:
    - not char_exists spyder_route2_roddick
    actions:
    - create_npc spyder_route2_roddick,15,9

  # --- Encounter zones ---

  Encounters:
    x: 2
    y: 2
    width: 26
    height: 16
    conditions:
    - is char_moved player
    - is char_at player
    actions:
    - random_encounter spyder_route2,11

  # --- Trainer battle ---

  Talk Roddick Pre Battle:
    conditions:
    - is char_facing_char player,spyder_route2_roddick
    - is button_pressed INTERACT
    - not battle_outcome player,spyder_route2_roddick,won
    actions:
    - char_face spyder_route2_roddick,player
    - lock_controls
    - dialog Hey! You look like a trainer. Let me test your skills!
    - start_battle spyder_route2_roddick
    - unlock_controls

  Talk Roddick Post Win:
    conditions:
    - is char_facing_char player,spyder_route2_roddick
    - is button_pressed INTERACT
    - is battle_outcome player,spyder_route2_roddick,won
    actions:
    - char_face spyder_route2_roddick,player
    - dialog You're pretty strong! Keep heading east to the City Park.

  # --- Map connections ---

  Go Cotton Town 10:
    x: 2
    y: 10
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,cotton_town.tmx,38,17,0.3
    - char_face player,left

  Go Cotton Town 11:
    x: 2
    y: 11
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,cotton_town.tmx,38,18,0.3
    - char_face player,left

  Go City Park 10:
    x: 27
    y: 10
    conditions:
    - is char_at player
    - is char_facing player,right
    actions:
    - transition_teleport player,spyder_citypark.tmx,2,11,0.3
    - char_face player,right

  Go City Park 11:
    x: 27
    y: 11
    conditions:
    - is char_at player
    - is char_facing player,right
    actions:
    - transition_teleport player,spyder_citypark.tmx,2,12,0.3
    - char_face player,right

  # --- Signs ---

  Route Sign West:
    x: 3
    y: 9
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog Route 2 — Cotton Town

  Route Sign East:
    x: 26
    y: 9
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog Route 2 — City Park
