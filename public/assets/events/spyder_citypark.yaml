events:
  # --- Music ---

  Play Music:
    conditions:
    - not music_playing music_the_wild_places
    actions:
    - play_music music_the_wild_places

  # --- NPC spawns ---

  Create Ranger:
    conditions:
    - not char_exists spyder_citypark_ranger
    actions:
    - create_npc spyder_citypark_ranger,17,8
    - char_face spyder_citypark_ranger,down

  # --- Trainer battle ---

  Talk Ranger Pre Battle:
    conditions:
    - is char_facing_char player,spyder_citypark_ranger
    - is button_pressed INTERACT
    - not battle_outcome player,spyder_citypark_ranger,won
    actions:
    - char_face spyder_citypark_ranger,player
    - lock_controls
    - dialog I patrol this park to keep it safe. Think you can handle my team?
    - start_battle spyder_citypark_ranger
    - unlock_controls

  Talk Ranger Post Win:
    conditions:
    - is char_facing_char player,spyder_citypark_ranger
    - is button_pressed INTERACT
    - is battle_outcome player,spyder_citypark_ranger,won
    actions:
    - char_face spyder_citypark_ranger,player
    - dialog Well fought! The path east leads to Route 3 and the old Mansion.

  # --- Map connections ---

  Go Route 2 11:
    x: 0
    y: 11
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_route2.tmx,26,10,0.3
    - char_face player,left

  Go Route 2 12:
    x: 0
    y: 12
    conditions:
    - is char_at player
    - is char_facing player,left
    actions:
    - transition_teleport player,spyder_route2.tmx,26,11,0.3
    - char_face player,left

  Go Route 3 11:
    x: 33
    y: 11
    conditions:
    - is char_at player
    - is char_facing player,right
    actions:
    - transition_teleport player,spyder_route3.tmx,2,10,0.3
    - char_face player,right

  Go Route 3 12:
    x: 33
    y: 12
    conditions:
    - is char_at player
    - is char_facing player,right
    actions:
    - transition_teleport player,spyder_route3.tmx,2,11,0.3
    - char_face player,right

  # --- Signs ---

  Park Sign West:
    x: 3
    y: 10
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog City Park — Route 2

  Park Sign East:
    x: 32
    y: 10
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog City Park — Route 3

  Park Welcome:
    x: 17
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - dialog Welcome to City Park! A peaceful place to rest and train.
