# Verbatim port of upstream's spyder_citypark.tmx Events object layer (STORY-0223),
# restricted to the map shell scope: route music + the five edge teleports + the
# Maniac House door. All trainers, ~30 encounter rects, PC boxes, signs, env
# day/night events and sight-line variants are deferred to follow-up stories
# (STORY-0224..0230). Paired teleports that share an upstream `name` are
# disambiguated A/B because our YAML loader uses the name as a unique key.

events:
  # --- Music (upstream object id 59) ---

  Route Music:
    x: 0
    y: 0
    conditions:
      - not music_playing music_city_park
    actions:
      - play_music music_city_park

  # --- South edge -> spyder_route2 (upstream ids 39 + 38) ---

  Teleport to Route 2 A:
    x: 10
    y: 39
    conditions:
      - is char_at player
      - is char_facing player,down
    actions:
      - transition_teleport player,spyder_route2.tmx,10,0,0.3
      - char_face player,down

  Teleport to Route 2 B:
    x: 11
    y: 39
    conditions:
      - is char_at player
      - is char_facing player,down
    actions:
      - transition_teleport player,spyder_route2.tmx,11,0,0.3
      - char_face player,down

  # --- West edge -> spyder_leather_town (upstream ids 40 + 41) ---
  # Our spyder_leather_town is still a 35x25 fabricated stub so the teleport
  # lands out-of-bounds (target tile 39,32-33). Acceptable per STORY-0223 —
  # follow-up STORY-0231 ports leather_town and re-wires the east entry.

  Teleport to Leather Town A:
    x: 0
    y: 12
    conditions:
      - is char_at player
      - is char_facing player,left
    actions:
      - transition_teleport player,spyder_leather_town.tmx,39,32,0.3
      - char_face player,left

  Teleport to Leather Town B:
    x: 0
    y: 13
    conditions:
      - is char_at player
      - is char_facing player,left
    actions:
      - transition_teleport player,spyder_leather_town.tmx,39,33,0.3
      - char_face player,left

  # --- Maniac House door (upstream id 289) ---
  # Target map spyder_citypark_house1 isn't ported yet — teleport is wired
  # one-way verbatim; the engine logs and stays put on missing-map (verified
  # in QA). Follow-up STORY-0230 ports the house.

  Teleport to Maniac House:
    x: 36
    y: 3
    conditions:
      - is char_at player
      - is char_facing player,up
    actions:
      - transition_teleport player,spyder_citypark_house1.tmx,6,7,0.3
      - char_face player,up
