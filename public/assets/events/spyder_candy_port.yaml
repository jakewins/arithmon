events:
  Create Captain:
    conditions:
      - not char_exists spyder_candy_captain
    actions:
      - create_npc spyder_candy_captain,7,5
      - char_face spyder_candy_captain,down

  Talk Captain:
    conditions:
      - is char_facing_char player,spyder_candy_captain
      - is button_pressed INTERACT
    actions:
      - char_face spyder_candy_captain,player
      - dialog Ahoy! I'm the Captain. I can take you to any town you've visited!

  Go Outside:
    x: 7
    y: 11
    conditions:
      - is char_at player
      - is char_facing player,down
    actions:
      - transition_teleport player,spyder_candy_town.tmx,8,10,0.3
      - char_face player,down
