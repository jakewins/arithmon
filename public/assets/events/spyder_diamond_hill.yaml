events:
  Play Music:
    conditions:
      - not music_playing music_the_wild_places
    actions:
      - play_music music_the_wild_places

  Go Candy Town:
    x: 10
    y: 2
    conditions:
      - is char_at player
      - is char_facing player,up
    actions:
      - transition_teleport player,spyder_candy_town.tmx,20,26,0.3
      - char_face player,up

  Go Route B:
    x: 17
    y: 8
    conditions:
      - is char_at player
      - is char_facing player,right
    actions:
      - transition_teleport player,spyder_routeB.tmx,3,10,0.3
      - char_face player,right

  Go Route C:
    x: 17
    y: 10
    conditions:
      - is char_at player
      - is char_facing player,right
    actions:
      - transition_teleport player,spyder_routeC.tmx,3,10,0.3
      - char_face player,right

  Hill Sign:
    x: 10
    y: 5
    conditions:
      - is char_facing_tile player
      - is button_pressed INTERACT
    actions:
      - dialog Diamond Hill — Candy Town / Route B / Route C
